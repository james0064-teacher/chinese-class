<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>妙故事點點名｜插畫互動課文（自閉友善版）</title>
<style>
:root{
  --bg:#fff8f2;
  --paper:#ffffff;
  --ink:#3f382f;
  --sub:#74695e;
  --line:#eadfce;
  --pink:#ffb7c5;
  --pink2:#ff8fa8;
  --blue:#a8dcff;
  --blue2:#6db8ef;
  --mint:#b8efd8;
  --mint2:#62c08f;
  --yellow:#ffe59a;
  --yellow2:#f4c957;
  --lav:#d7c6ff;
  --lav2:#9577de;
  --orange:#ffc79f;
  --orange2:#ef9367;
  --good:#5cb988;
  --bad:#d06b6b;
  --shadow:0 10px 28px rgba(82,72,58,.12);
  --ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --kai:"DFKai-SB","BiauKai","標楷體","Kaiti TC","楷體-繁","STKaiti","KaiTi",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui);
  background:
    radial-gradient(circle at 8% 10%, #fff 0 48px, transparent 48px),
    radial-gradient(circle at 92% 16%, #fff 0 60px, transparent 60px),
    linear-gradient(180deg,#fff9f1 0%,#fff3fa 55%,#eef9ff 100%);
  color:var(--ink);
  padding:14px;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto}
.app{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 16px;background:#fffdfb;border-bottom:1px solid var(--line)
}
.topbar strong{font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mini{
  border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;
  color:#5f554a;font-weight:800
}
.mini.active{background:#eef8ff;border-color:#addcff;color:#357fb5}
.hero{
  padding:24px 20px 18px;
  background:linear-gradient(180deg,#fffefc 0%,#fff9ee 100%);
  border-bottom:1px solid var(--line)
}
.hero-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:center}
.mascot-card{
  background:linear-gradient(145deg,#fff2f6,#fefcff);
  border:2px solid #ffd8e2;border-radius:24px;padding:18px;position:relative;min-height:220px
}
.mascot-card svg{width:100%;height:100%}
.title-card{
  background:#fff;border:2px solid var(--line);border-radius:24px;padding:20px
}
.title{
  font-size:clamp(28px,4vw,42px);margin:0 0 8px;letter-spacing:1px
}
.sub{color:var(--sub);line-height:1.8;margin:0 0 14px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff7da;border:2px solid #f7db79;border-radius:999px;padding:7px 12px;font-weight:900;color:#7a6120
}
.schedule{
  display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:16px 18px;background:#f9fcff;border-bottom:1px solid var(--line)
}
.step{
  background:#fff;border:2px solid #e4edf5;border-radius:18px;padding:12px 8px;text-align:center;font-weight:900;color:#5d6670
}
.step .ico{display:block;font-size:25px;margin-bottom:4px}
.step.on{background:#eef8ff;border-color:#addbff;color:#2f7db5}
.status{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px;background:#f9fcff
}
.stat{
  background:#fff;border:2px solid #e3edf4;border-radius:18px;padding:10px;text-align:center
}
.stat small{display:block;color:var(--sub);margin-bottom:5px}
.stat span{font-size:22px;font-weight:1000}
nav{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.tab{
  border:2px solid var(--line);background:#fffdf8;border-radius:999px;padding:10px 14px;font-weight:900;color:#5f5448
}
.tab.active{background:#ffb8c6;border-color:#ff92aa;color:#7e3145}
main{padding:20px}
.view{display:none}
.view.active{display:block}
.card{
  background:#fff;border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px rgba(90,80,60,.05)
}
.card h2,.card h3{margin-top:0}
.label{
  display:inline-block;background:#eef8ff;border:2px solid #b8dfff;color:#337eb4;font-size:12px;font-weight:1000;padding:5px 11px;border-radius:999px;margin-bottom:8px
}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.menu-btn{
  border:2px solid #eadfd0;border-radius:22px;padding:16px;text-align:left;background:linear-gradient(180deg,#fff 0%,#fffdfa 100%);
  min-height:132px;display:flex;flex-direction:column;justify-content:space-between
}
.menu-btn .icon{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:28px;margin-bottom:6px
}
.menu-btn b{display:block;font-size:18px;margin-bottom:5px}
.menu-btn span{display:block;color:var(--sub);line-height:1.6;font-size:13px}
.icon.pink{background:#ffe0e8}
.icon.blue{background:#e0f2ff}
.icon.mint{background:#ddfaee}
.icon.yellow{background:#fff2c8}
.icon.lav{background:#eee7ff}
.icon.orange{background:#ffe5d6}

.first-then{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:16px
}
.ft{
  border:2px dashed #d8e4eb;border-radius:18px;padding:14px;text-align:center;background:#fff
}
.ft b{display:block;font-size:18px}
.illustration{
  background:linear-gradient(180deg,#fef7ff 0%,#f5fbff 100%);
  border:2px solid #e6def6;border-radius:22px;padding:16px;text-align:center
}
.illustration svg{width:100%;max-width:430px;height:auto}

.word-layout{
  display:grid;grid-template-columns:1.1fr .95fr;gap:18px;align-items:start
}
.big-card{
  background:linear-gradient(180deg,#fffefc 0%,#fff7fb 100%);
  border:2px solid #f1e0e9;border-radius:24px;padding:18px
}
.word-main{
  font-family:var(--kai);font-size:104px;text-align:center;line-height:1;margin:8px 0 10px;color:#7b5740
}
.zhuyin{
  text-align:center;font-size:28px;font-weight:1000;color:#e16d8e;margin:0 0 8px
}
.pill{
  display:inline-block;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:1000
}
.pill.write{background:#fff4d2;border:2px solid #f7d05c;color:#81621b}
.pill.read{background:#eef8ff;border:2px solid #bde1ff;color:#2e7bb0}
.meta{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0
}
.meta .m{
  background:#fff;border:2px solid #eee3d5;border-radius:16px;padding:10px;text-align:center
}
.meta .m strong{display:block;font-size:20px;font-family:var(--kai)}
.words{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px
}
.words span{
  background:#f7fbff;border:2px solid #d8e9f6;border-radius:999px;padding:7px 12px;font-weight:900
}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{
  border:none;border-radius:14px;padding:12px 18px;font-weight:1000;box-shadow:0 4px 0 rgba(0,0,0,.11)
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.btn.blue{background:var(--blue2);color:#fff}
.btn.pink{background:var(--pink2);color:#fff}
.btn.mint{background:var(--mint2);color:#fff}
.btn.yellow{background:var(--yellow2);color:#6a5517}
.btn.ghost{background:#fff;border:2px solid #e8dccd;color:#5d5247;box-shadow:none}
.progress{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--sub);font-weight:800
}
.dotbar{display:flex;gap:5px;flex:1}
.dotbar i{height:10px;flex:1;border-radius:999px;background:#ece6df}
.dotbar i.on{background:#ffb7c5}
.dotbar i.done{background:#9fdfa9}

.vocab-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}
.vocab{
  background:#fff;border:2px solid #eadfd0;border-radius:20px;overflow:hidden
}
.vocab .pic{
  background:linear-gradient(180deg,#fef7fb 0%,#f0f9ff 100%);
  border-bottom:2px dashed #eddfe7;
  min-height:145px;display:grid;place-items:center;padding:10px
}
.vocab .pic svg{width:100%;height:120px}
.vocab .info{padding:14px}
.vocab .char{font-family:var(--kai);font-size:40px;font-weight:700}
.vocab .bp{color:#d46887;font-weight:900}
.vocab .word{color:#5b544d;margin-top:4px;font-weight:800}
.vocab .tag{
  display:inline-block;margin-top:8px;background:#fff4d2;border:2px solid #f1d16b;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;color:#7e6420
}
.reading-box{
  background:#fffdf8;border:2px dashed #e6d8c7;border-radius:20px;padding:16px
}
textarea{
  width:100%;min-height:180px;border:2px solid #e6d8c7;border-radius:18px;padding:14px;background:#fff;font-size:18px;line-height:1.9;color:#4c443c
}
textarea:focus{outline:3px solid rgba(109,184,239,.25)}
.story-line{
  font-family:var(--kai);font-size:36px;line-height:1.9;text-align:center;background:#fff;border:2px solid #efe3d6;border-radius:18px;padding:18px;min-height:140px
}
.story-line .key{color:#cb607f;font-weight:700}
.story-line .read{color:#cc8f2d}
.story-line .sel{background:#ffefb6;border-radius:8px;padding:0 2px}
.center{text-align:center}
.note{font-size:14px;color:var(--sub);line-height:1.8}
.opts{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px
}
.opt{
  border:2px solid #eadfd0;border-radius:18px;padding:14px;background:#fff;font-size:22px;font-family:var(--kai);font-weight:700;min-height:76px
}
.opt.right{background:#ebfff4;border-color:#b5ebcb}
.opt.wrong{background:#fff0f0;border-color:#e9b8b8}
.feedback{
  display:none;margin-top:14px;padding:14px;border-radius:16px;font-weight:900
}
.feedback.show{display:block}
.feedback.ok{background:#ebfff4;color:#2e7a57}
.feedback.no{background:#fff0f0;color:#a24e4e}
.quiz-q{
  font-size:24px;font-weight:1000;text-align:center;margin-bottom:10px
}
.breakbox{
  background:#f7fcff;border:2px solid #d6e9f7;border-radius:22px;padding:18px;text-align:center
}
.breathe{
  width:94px;height:94px;border-radius:50%;margin:8px auto;background:#dff1ff;display:grid;place-items:center;font-size:42px;animation:breathe 4s ease-in-out infinite
}
@keyframes breathe{
  0%,100%{transform:scale(.92)}
  50%{transform:scale(1.08)}
}
footer{padding:18px;text-align:center;color:var(--sub);font-size:13px;border-top:1px solid var(--line)}

@media (max-width:900px){
  .hero-grid,.word-layout{grid-template-columns:1fr}
  .menu-grid,.vocab-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  body{padding:0}
  .app{border-radius:0;min-height:100vh}
  .schedule,.status{grid-template-columns:repeat(2,1fr)}
  .menu-grid,.vocab-grid,.opts,.meta{grid-template-columns:1fr}
  .first-then{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.lesson-switch{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 16px
}
.lesson-switch button{
  border:2px solid #eadfd0;background:#fff;border-radius:999px;padding:9px 14px;
  font-weight:900;color:#5f5448
}
.lesson-switch button.on{
  background:#ffedf2;border-color:#ffabc0;color:#8b4054
}
.lesson-text{
  background:#fffdf9;border:2px solid #eadfd0;border-radius:22px;padding:20px;
  font-family:var(--kai);font-size:22px;line-height:2.1;letter-spacing:1px
}
.lesson-text p{margin:0 0 16px;text-indent:2em}
.lesson-text p:last-child{margin-bottom:0}
.lesson-text .key{color:#c95b7a;font-weight:700;background:#fff0f4;border-radius:5px;padding:0 2px}
.lesson-text .read{color:#c48721;font-weight:700;background:#fff7dc;border-radius:5px;padding:0 2px}
.lesson-note{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px
}
.lesson-note div{
  background:#f8fbfd;border:2px solid #e0ebf1;border-radius:15px;padding:11px;text-align:center;font-size:13px;color:#5f6870
}
.lesson-note b{display:block;color:#3e4b54;margin-bottom:3px}
@media(max-width:640px){.lesson-note{grid-template-columns:1fr}}


/* =========================================================
   國小課本式直排注音
   固定三欄：漢字｜注音｜聲調
   注音永遠在國字右方；聲調永遠在注音右方且垂直置中
   ========================================================= */
.zy{
  display:inline-grid;
  grid-template-columns:1em .58em .38em;
  grid-template-rows:1fr;
  align-items:center;
  justify-items:center;
  vertical-align:middle;
  width:1.96em;
  min-width:1.96em;
  max-width:1.96em;
  min-height:1.55em;
  margin:0 .025em;
  padding:0;
  white-space:nowrap;
  text-indent:0;
}
.zy .rb{
  grid-column:1;
  grid-row:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:1em;
  min-width:1em;
  height:1.55em;
  line-height:1.55em;
  text-align:center;
}
.zy .rt{
  display:contents;
}
.zy .ph{
  grid-column:2;
  grid-row:1;
  align-self:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:.58em;
  min-width:.58em;
  min-height:1.55em;
  font-family:"BopomofoRuby1909","BopomofoRuby","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:.39em;
  line-height:.82;
  letter-spacing:0;
  color:#75675d;
  text-align:center;
}
.zy .ph > span{
  display:block;
  width:100%;
  height:.82em;
  line-height:.82em;
  text-align:center;
}
.zy .tone{
  grid-column:3;
  grid-row:1;
  align-self:center;
  justify-self:center;
  display:flex;
  align-items:center;
  justify-content:center;
  width:.38em;
  min-width:.38em;
  height:1.55em;
  min-height:1.55em;
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:.39em;
  line-height:1;
  color:#75675d;
  text-align:center;
}
.zy .tone:empty::after{
  content:"";
  display:block;
  width:.38em;
  height:1px;
}
.lesson-text .zy .rb.key{
  color:#c95b7a;
  font-weight:700;
  background:#fff0f4;
  border-radius:5px;
}
.lesson-text .zy .rb.read{
  color:#c48721;
  font-weight:700;
  background:#fff7dc;
  border-radius:5px;
}
.lesson-text p{
  margin:0 0 18px;
  padding-left:2em;
  text-indent:0 !important;
  line-height:2.15;
}
.lesson-text p:last-child{margin-bottom:0}
@media(max-width:640px){
  .lesson-text{
    font-size:21px;
    line-height:2.2;
    padding:15px 12px;
  }
  .zy{
    grid-template-columns:1em .60em .40em;
    width:2em;
    min-width:2em;
    max-width:2em;
  }
  .zy .ph{
    width:.60em;
    min-width:.60em;
    font-size:.40em;
  }
  .zy .tone{
    width:.40em;
    min-width:.40em;
    font-size:.40em;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="topbar">
      <strong>🌼 妙故事點點名｜同一學生專用互動課文</strong>
      <div class="row">
        <button class="mini" id="soundBtn">🔊 聲音：開</button>
        <button class="mini" id="breakBtn">🌿 休息一下</button>
      </div>
    </div>

    <section class="hero">
      <div class="hero-grid">
        <div class="mascot-card" aria-hidden="true">
          <svg viewBox="0 0 260 210">
            <rect x="0" y="0" width="260" height="210" rx="24" fill="#fff9fc"/>
            <ellipse cx="130" cy="177" rx="95" ry="16" fill="#f8d9e2"/>
            <circle cx="74" cy="55" r="18" fill="#fff"/>
            <circle cx="196" cy="42" r="14" fill="#fff"/>
            <circle cx="110" cy="97" r="42" fill="#fff7f8" stroke="#ffc9d5" stroke-width="3"/>
            <ellipse cx="92" cy="53" rx="14" ry="32" fill="#fff7f8" stroke="#ffc9d5" stroke-width="3" transform="rotate(-12 92 53)"/>
            <ellipse cx="129" cy="50" rx="14" ry="34" fill="#fff7f8" stroke="#ffc9d5" stroke-width="3" transform="rotate(10 129 50)"/>
            <ellipse cx="92" cy="59" rx="7" ry="21" fill="#ffd6df" transform="rotate(-12 92 59)"/>
            <ellipse cx="129" cy="56" rx="7" ry="22" fill="#ffd6df" transform="rotate(10 129 56)"/>
            <circle cx="98" cy="94" r="5" fill="#6d5f53"/>
            <circle cx="122" cy="94" r="5" fill="#6d5f53"/>
            <ellipse cx="110" cy="107" rx="6.5" ry="5" fill="#ff9bb3"/>
            <path d="M104 114 Q110 120 116 114" fill="none" stroke="#9c6a76" stroke-width="3" stroke-linecap="round"/>
            <circle cx="84" cy="102" r="6" fill="#ffd8e2"/>
            <circle cx="137" cy="102" r="6" fill="#ffd8e2"/>
            <rect x="152" y="108" width="68" height="48" rx="10" fill="#a8dcff" stroke="#6db8ef" stroke-width="3"/>
            <rect x="160" y="118" width="52" height="30" rx="6" fill="#fff"/>
            <text x="186" y="138" text-anchor="middle" font-size="22" font-family="DFKai-SB, KaiTi, serif" fill="#6d5f53">妙</text>
            <circle cx="180" cy="172" r="22" fill="#ffe69b" stroke="#f4c957" stroke-width="3"/>
            <path d="M180 154 L186 167 L201 169 L190 179 L193 194 L180 187 L167 194 L170 179 L159 169 L174 167 Z" fill="#fff7da"/>
          </svg>
        </div>
        <div class="title-card">
          <h1 class="title">妙故事點點名</h1>
          <p class="sub">這是一份為同一位學生設計的插畫互動課文。畫面維持可愛、穩定、可預期；一次只做一小步，並加入可以按讀音的圖像生字卡，幫助孩子主動參與。</p>
          <div class="badges">
            <span class="badge">🐰 可愛插畫</span>
            <span class="badge">🧩 自閉友善</span>
            <span class="badge">🔊 可唸讀音</span>
            <span class="badge">🖼️ 生字圖卡</span>
          </div>
        </div>
      </div>
    </section>

    <section class="schedule" id="schedule">
      <div class="step on" data-step="home"><span class="ico">🏠</span>先看任務</div>
      <div class="step" data-step="intro"><span class="ico">📖</span>故事導讀</div>
      <div class="step" data-step="lesson"><span class="ico">📚</span>課文閱讀</div>
      <div class="step" data-step="cards"><span class="ico">🪄</span>生字圖卡</div>
      <div class="step" data-step="gallery"><span class="ico">🖼️</span>圖卡總覽</div>
      <div class="step" data-step="idiom"><span class="ico">🌈</span>詞語理解</div>
      <div class="step" data-step="quiz"><span class="ico">⭐</span>小挑戰</div>
    </section>

    <section class="status">
      <div class="stat"><small>⭐ 星星</small><span id="stars">0</span></div>
      <div class="stat"><small>✅ 完成題數</small><span id="done">0</span></div>
      <div class="stat"><small>🔥 連續答對</small><span id="streak">0</span></div>
      <div class="stat"><small>🪄 看過圖卡</small><span id="viewed">0</span></div>
    </section>

    <nav>
      <button class="tab active" data-view="home">首頁</button>
      <button class="tab" data-view="intro">故事導讀</button>
      <button class="tab" data-view="lesson">課文閱讀</button>
      <button class="tab" data-view="cards">生字圖卡</button>
      <button class="tab" data-view="gallery">圖卡總覽</button>
      <button class="tab" data-view="read">朗讀室</button>
      <button class="tab" data-view="idiom">詞語理解</button>

  starsEl.textContent = stars;

}

  if(ok){
    stars += 1;
    done += 1;
    streak += 1;
    playSuccess();
  }else{
    streak = 0;
    playFail();
  }
  updateStatus();
}

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function speak(t){
  if(!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang='zh-TW';
  u.rate=.88;
  speechSynthesis.speak(u);
}

let audioCtx;
function tone(freq,type='triangle',duration=.18){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(.12,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+duration);
  }catch(e){}
}
function playSuccess(){tone(587);setTimeout(()=>tone(784,'triangle',.28),140)}
function playFail(){tone(220,'sine',.2)}

        <button onclick="loadReaderText('original')">📖 載入課本原文</button>
        <button onclick="loadReaderText('simple')">🌱 載入簡化版</button>
      </div>
      <div class="reading-box">
        <textarea id="txt">${storyLines.join('\n')}</textarea>
        <div class="controls">
          <button class="btn blue" onclick="applyStory()">開始逐句朗讀</button>
          <button class="btn yellow" onclick="showReadLine(0)">用目前內容練習</button>
        </div>
      </div>
    </div>
    <div id="storyArea"></div>
  </section>`;
}

function loadReaderText(mode){
  storyLines = (mode==="original" ? ORIGINAL_PARAGRAPHS : SIMPLE_PARAGRAPHS).slice();
  document.getElementById('txt').value = storyLines.join('\n');
}

function applyStory(){
  const raw=document.getElementById('txt').value.trim();
  storyLines = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(!storyLines.length) storyLines=["老師在教室裡點名。"];
  showReadLine(0);
}
function showReadLine(i){
  if(i<0)i=0;
  if(i>=storyLines.length)i=storyLines.length-1;
  const s=storyLines[i];
  const html=[...s].map(ch=>{
    const cls = KEYSET.has(ch)?'key':BPMAP[ch]?'read':'';
    return `<span class="${cls}" data-ch="${esc(ch)}">${esc(ch)}</span>`;
  }).join('');
  document.getElementById('storyArea').innerHTML = `
    <div class="card">
      <div class="progress">
        <span>逐句朗讀</span>
        <div class="dotbar">${storyLines.map((_,idx)=>`<i class="${idx<i?'done':idx===i?'on':''}"></i>`).join('')}</div>
        <span>${i+1} / ${storyLines.length}</span>
      </div>
      <div class="story-line">${html}</div>
      <p class="note center" id="charInfo">點一個字，看看注音。</p>
      <div class="controls">
        <button class="btn ghost" ${i===0?'disabled':''} onclick="showReadLine(${i-1})">← 上一句</button>
        <button class="btn yellow" onclick="speakLine(${i})">🔊 唸這一句</button>
        <button class="btn ghost" ${i===storyLines.length-1?'disabled':''} onclick="showReadLine(${i+1})">下一句 →</button>
      </div>
    </div>`;
  speak(s);
}
function speakLine(i){
  speak(storyLines[i]);
}
function showChar(ch,el){
  document.querySelectorAll('.story-line span').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('charInfo').textContent = BPMAP[ch] ? `${ch}　${BPMAP[ch]}` : `${ch}`;
  speak(ch);
}

function renderIdiom(i){
  if(i<0)i=0;
  if(i>=IDIOMS.length)i=IDIOMS.length-1;
  idiomIndex=i;
  const x=IDIOMS[i];
  main.innerHTML = `
  <section class="view active">
    <div class="card">
      <div class="progress">
        <span>詞語理解</span>
        <div class="dotbar">${IDIOMS.map((_,idx)=>`<i class="${idx<i?'done':idx===i?'on':''}"></i>`).join('')}</div>
        <span>${i+1} / ${IDIOMS.length}</span>
      </div>
      <h2 style="text-align:center;font-family:var(--kai);font-size:48px;letter-spacing:6px;color:#8b5a62">${esc(x.w)}</h2>
      <p class="zhuyin">${esc(x.b)}</p>
      <div class="card" style="background:#fffdf8">
        <h3>意思</h3>
        <p class="note" style="font-size:18px;color:#4e473f">${esc(x.mean)}</p>
        <h3>生活例子</h3>
        <p class="note" style="font-size:18px;color:#4e473f">${esc(x.scene)}</p>
      </div>
      <div class="controls">
        <button class="btn yellow" onclick="speak('${x.w}。${x.mean}。${x.scene}')">🔊 唸給我聽</button>
        <button class="btn ghost" ${i===0?'disabled':''} onclick="renderIdiom(${i-1})">← 上一個</button>
        <button class="btn ghost" ${i===IDIOMS.length-1?'disabled':''} onclick="renderIdiom(${i+1})">下一個 →</button>
      </div>
    </div>
  </section>`;
}

function startQuiz(){
  quizIndex=0; quizScore=0;
  nextQuiz();
}
function sample(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function nextQuiz(){
  if(quizIndex>=quizTotal){
    main.innerHTML = `
    <section class="view active">
      <div class="card center">
        <span class="label">小挑戰完成</span>
        <h2>🎉 完成了！</h2>
        <p class="note" style="font-size:22px">你答對了 <b>${quizScore}</b> / ${quizTotal} 題</p>
        <div class="controls">
          <button class="btn blue" onclick="startQuiz()">再玩一次</button>
          <button class="btn pink" onclick="showView('gallery')">回生字圖卡</button>
        </div>
      </div>
    </section>`;
    speak(`小挑戰完成，你答對了 ${quizScore} 題。`);
    return;
  }

  const mode = Math.random()<0.65 ? 'bp' : 'word';
  const pool = ALL_WORDS;
  const ans = sample(pool);
  const opts = shuffle([ans, ...shuffle(pool.filter(x=>x.c!==ans.c)).slice(0,3)]);

  main.innerHTML = `
  <section class="view active">
    <div class="card">
      <div class="progress">
        <span>小挑戰</span>
        <div class="dotbar">${Array.from({length:quizTotal},(_,idx)=>`<i class="${idx<quizIndex?'done':idx===quizIndex?'on':''}"></i>`).join('')}</div>
        <span>${quizIndex+1} / ${quizTotal}</span>
      </div>
      <div class="quiz-q">${mode==='bp' ? `哪一個字念作「${ans.b}」？` : `哪一個語詞和「${ans.c}」有關？`}</div>
      <div class="opts" id="opts">
        ${opts.map(x=>`
          <button class="opt" onclick="gradeQuiz(this,'${x.c}','${ans.c}','${mode}')">
            ${mode==='bp' ? `<span style="font-size:44px">${x.c}</span>` : `${x.w[0]}`}
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  </section>`;
}
function gradeQuiz(btn,pick,ans,mode){
  const ok = pick===ans;
  const fb=document.getElementById('fb');
  document.querySelectorAll('#opts .opt').forEach(el=>el.disabled=true);
  if(ok){
    btn.classList.add('right');
    fb.className='feedback show ok';
    fb.innerHTML='✅ 答對了！';
    quizScore++;
    reward(true);
  }else{
    btn.classList.add('wrong');
    fb.className='feedback show no';
    const right = ALL_WORDS.find(x=>x.c===ans);
    fb.innerHTML=`❗ 再記一次：${right.c} 的注音是 ${right.b}，相關語詞有「${right.w[0]}」。`;
    reward(false);
  }
  quizIndex++;
  setTimeout(nextQuiz,1000);
}
